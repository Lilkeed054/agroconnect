<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>AgroConnect – Fresh from local farms to your table</title>
    <meta name="description" content="Hyperlocal marketplace connecting farmers and artisans with your community – fresh, fair, and sustainable." />
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- AOS CSS (scroll animations) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    
    <!-- Dark theme foundation – prevents white flash before React loads -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0A120A;
        color: #D0D8C8;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #root {
        min-height: 100vh;
        background: #0A120A;
      }
      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }
      /* Custom scrollbar – matches dark theme */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0A120A;
      }
      ::-webkit-scrollbar-thumb {
        background: #D4A837;
        border-radius: 10px;
        border: 2px solid #0A120A;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C49A2E;
      }
      /* Firefox scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: #D4A837 #0A120A;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
